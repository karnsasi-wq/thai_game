<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Game (Grade 1 - 3)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f8ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 16px;
            color: #636e72;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-g1 { background-color: #ff7675; color: white; }
        .btn-g2 { background-color: #74b9ff; color: white; }
        .btn-g3 { background-color: #55efc4; color: #2d3436; }
        .btn-all { background-color: #a29bfe; color: white; }
        .btn-next { background-color: #00b894; color: white; margin-top: 20px; width: 100%; font-size: 24px; }
        .btn-home { background-color: #6c5ce7; color: white; margin-top: 20px; width: 100%; }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        button:active {
            transform: translateY(0);
        }

        /* Screen Styles */
        .screen { display: none; }
        .active { display: block; }

        /* Game Elements */
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #636e72;
            margin-bottom: 20px;
        }
        .word-box {
            font-size: 52px;
            font-weight: bold;
            color: #2d3436;
            padding: 40px 10px;
            background-color: #f1f2f6;
            border-radius: 15px;
            border: 3px dashed #b2bec3;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
        .timer-bar-container {
            width: 100%;
            height: 12px;
            background-color: #dfe6e9;
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #ff7675;
            transition: width 1s linear;
        }

        /* Summary Panel */
        .history-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ffeaa7;
            border-radius: 10px;
            text-align: left;
            font-size: 16px;
            color: #d63031;
        }
        .history-box h3 { margin: 0 0 10px 0; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าแรก: เลือก Grade -->
    <div id="home-screen" class="screen active">
        <h1>🎲 English Word Game</h1>
        <p class="subtitle">Select a grade to start (30 random words)</p>
        <div class="btn-group">
            <button class="btn-g1" onclick="startGame('G1')">Grade 1</button>
            <button class="btn-g2" onclick="startGame('G2')">Grade 2</button>
            <button class="btn-g3" onclick="startGame('G3')">Grade 3</button>
            <button class="btn-all" onclick="startGame('ALL')">All Grades (Grade 1 - 3)</button>
        </div>

        <!-- สรุปผลการเล่นรอบก่อนหน้า -->
        <div id="last-summary" class="history-box" style="display: none;">
            <h3>📊 Last Round Summary</h3>
            <div id="summary-content"></div>
        </div>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="screen">
        <div class="header-info">
            <span id="level-label">Level: Grade 1</span>
            <span id="progress-label">Word 1/30</span>
            <span id="time-label">⏳ 10s</span>
        </div>
        
        <div class="word-box" id="word-display">Word</div>

        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <button class="btn-next" onclick="nextWord()">Next ➔</button>
    </div>

    <!-- หน้าจบเกม -->
    <div id="result-screen" class="screen">
        <h1>🎉 Great Job! Finished</h1>
        <p style="font-size: 18px; color: #2d3436;">You completed all 30 words.</p>
        <div class="history-box" style="background-color: #e3f2fd; color: #0984e3;" id="current-summary">
            <!-- สรุปเวลารอบปัจจุบัน -->
        </div>
        <button class="btn-home" onclick="goHome()">Back to Home</button>
    </div>
</div>

<script>
    // ชุดคำศัพท์ภาษาอังกฤษแยกตาม Grade
    const wordBank = {
        G1: [
            "about", "form", "other", "there", "across", "friend", "Mr.", "these", "after", "from",
            "Mrs.", "they", "also", "girl", "never", "two", "another", "goes", "new", "under",
            "any", "good", "nothing", "very", "around", "has", "now", "walk", "behave", "one",
            "want", "because", "her", "only", "we'll", "before", "here", "or", "were", "being",
            "he's", "other", "what", "both", "his", "our", "when", "boy", "how", "out",
            "where", "brother", "I'm", "over", "who", "can't", "into", "people", "word", "could",
            "know", "put", "work", "day", "little", "saw", "would", "do", "look", "say",
            "your", "does", "make", "she", "don't", "many", "she's", "down", "month", "should",
            "each", "more", "so", "first", "most", "talk"
        ],
        G2: [
            "action", "early", "often", "their", "addition", "earth", "once", "they're", "again", "enough",
            "own", "those", "alway", "sequal", "picture", "thought", "America", "every", "place", "through",
            "animal", "eye", "please", "Thursday", "answer", "family", "pretty", "together", "August", "father",
            "ready", "too", "away", "favorite", "really", "trouble", "beautiful", "February", "reread", "Tuesday",
            "been", "give", "rewrite", "unlock", "between", "great", "right", "until", "bough", "thouse",
            "Saturday", "use", "breakfast", "its", "says", "water", "change", "January", "school", "Wednesday",
            "child", "knew", "second", "which", "children", "large", "sister", "while", "city", "laugh",
            "something", "why", "color", "learn", "sometimes", "won't", "country", "Monday", "special", "world",
            "couple", "move", "sugar", "write", "cousin", "neighbor", "sure", "wrote", "daughter", "none",
            "teacher", "young", "done", "ocean", "than", "you're"
        ],
        G3: [
            "ability", "absorb", "accuse", "act", "active", "actual", "adopt", "advantage", "advice", "ambition",
            "ancient", "approach", "arrange", "arctic", "attitude", "attract", "average", "avoid", "bold", "border",
            "brief", "brilliant", "cable", "capture", "certain", "chill", "clever", "climate", "cling", "coast",
            "confess", "consider", "contain", "continent", "convince", "coward", "crew", "crumple", "custom", "decay",
            "deed", "defend", "delicate", "device", "diagram", "digest", "disease", "distant", "doze", "drift",
            "elegant", "enable", "examine", "explore", "fan", "fatal", "fierce", "flutter", "fortunate", "frail",
            "gasp", "glide", "globe", "grace", "gradual", "grasp", "habit", "harsh", "imitate", "individual",
            "intelligent", "intend", "journey", "launch", "limit", "locate", "loyal", "magnificent", "marsh", "method",
            "misery", "moisture", "mural", "mystify", "nation", "nectar", "nursery", "observe", "opponent", "opposite",
            "ordeal", "origin", "outcome", "passage", "pastime", "pause", "perform", "plunge", "predator", "predict",
            "prevent", "primary", "privilege", "process", "rare", "rate", "recall", "rely", "remark", "resident",
            "respect", "responsible", "reverse", "revive", "risk", "scatter", "schedule", "sensitive", "signal", "solution",
            "spoil", "starve", "steer", "struggled", "suitable", "survey", "swift", "symbol", "talent", "theory",
            "thrill", "treasure", "triumph", "value", "vision", "volunteer", "wander", "wisdom", "wit", "woe"
        ]
    };

    let currentPlaylist = [];
    let currentIndex = 0;
    let timer = null;
    let timeLeft = 10;
    let totalTimeSeconds = 0;
    let totalTimer = null;
    let currentLevelName = "";

    function startGame(level) {
        let rawWords = [];
        if (level === 'G1') {
            rawWords = [...wordBank.G1];
            currentLevelName = "Grade 1";
        } else if (level === 'G2') {
            rawWords = [...wordBank.G2];
            currentLevelName = "Grade 2";
        } else if (level === 'G3') {
            rawWords = [...wordBank.G3];
            currentLevelName = "Grade 3";
        } else if (level === 'ALL') {
            rawWords = [...wordBank.G1, ...wordBank.G2, ...wordBank.G3];
            currentLevelName = "All Grades (Grade 1 - 3)";
        }

        // สุ่มคำศัพท์แบบสลับลำดับ (Shuffle) และตัดมา 30 คำ
        currentPlaylist = shuffleArray(rawWords).slice(0, 30);
        currentIndex = 0;
        totalTimeSeconds = 0;

        // เปลี่ยนหน้าจอ
        showScreen('game-screen');
        document.getElementById('level-label').innerText = `Level: ${currentLevelName}`;

        // เริ่มจับเวลารวม
        clearInterval(totalTimer);
        totalTimer = setInterval(() => {
            totalTimeSeconds++;
        }, 1000);

        showWord();
    }

    function showWord() {
        if (currentIndex >= currentPlaylist.length) {
            endGame();
            return;
        }

        // อัปเดตคำศัพท์และลำดับคำ
        document.getElementById('progress-label').innerText = `Word ${currentIndex + 1}/${currentPlaylist.length}`;
        document.getElementById('word-display').innerText = currentPlaylist[currentIndex];

        // รีเซ็ตเวลานับถอยหลัง 10 วินาที
        resetTimer();
    }

    function resetTimer() {
        clearInterval(timer);
        timeLeft = 10;
        updateTimerDisplay();

        timer = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                // หมดเวลา -> ข้ามไปคำถัดไป
                clearInterval(timer);
                nextWord();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('time-label').innerText = `⏳ ${timeLeft}s`;
        const percentage = (timeLeft / 10) * 100;
        document.getElementById('timer-bar').style.width = `${percentage}%`;
    }

    function nextWord() {
        clearInterval(timer);
        currentIndex++;
        showWord();
    }

    function endGame() {
        clearInterval(timer);
        clearInterval(totalTimer);

        const minutes = Math.floor(totalTimeSeconds / 60);
        const seconds = totalTimeSeconds % 60;
        const timeText = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;

        const summaryHTML = `
            <p><strong>Level:</strong> ${currentLevelName}</p>
            <p><strong>Words Read:</strong> ${currentPlaylist.length} words</p>
            <p><strong>Total Time:</strong> ${timeText}</p>
        `;

        // แสดงผลสรุปและบันทึกไว้หน้าแรก
        document.getElementById('current-summary').innerHTML = summaryHTML;
        document.getElementById('summary-content').innerHTML = summaryHTML;
        document.getElementById('last-summary').style.display = 'block';

        showScreen('result-screen');
    }

    function goHome() {
        showScreen('home-screen');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ฟังก์ชันสุ่มสลับลำดับอาเรย์ (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
</script>

</body>
</html>
