<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมสุ่มคำศัพท์ฝึกอ่าน</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', 'Chakra Petch', sans-serif, Tahoma;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        h2 { color: #34495e; }
        
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.2s;
            width: 80%;
        }
        .btn:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-next { background-color: #2ecc71; font-size: 24px; padding: 15px 40px; width: auto; }
        .btn-next:hover { background-color: #27ae60; }
        
        .word-display {
            font-size: 50px;
            font-weight: bold;
            color: #2c3e50;
            margin: 40px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .timer-bar-container {
            width: 100%;
            background-color: #eee;
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #e74c3c;
            transition: width 0.1s linear;
        }
        
        .info-text { font-size: 18px; color: #7f8c8d; }
        .failed-list {
            text-align: left;
            background: #fff5f5;
            padding: 15px 30px;
            border-radius: 10px;
            border: 1px solid #feb2b2;
            max-height: 250px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .failed-list li { font-size: 20px; color: #c53030; margin-bottom: 5px; }
        .history-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed #cbd5e0;
            color: #4a5568;
            font-size: 16px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <!-- หน้าเลือกสถาวะ/ระดับ -->
    <div id="start-screen">
        <h1>เกมสุ่มคำศัพท์ฝึกอ่าน</h1>
        <p class="info-text">เลือกระดับที่ต้องการเล่น (สุ่ม 30 คำ / คำละ 10 วินาที)</p>
        <button class="btn" onclick="startGame('consonants')">1. ทายพยัญชนะ</button><br>
        <button class="btn" onclick="startGame('vowels')">2. ทายสระ</button><br>
        <button class="btn" onclick="startGame('p1')">3. ทายคำ ป.1</button><br>
        <button class="btn" onclick="startGame('p2')">4. ทายคำ ป.2</button><br>
        <button class="btn" onclick="startGame('p3')">5. ทายคำ ป.3</button><br>
        <button class="btn" style="background-color: #8e44ad;" onclick="startGame('all')">6. ทายคำรวมกันทุกระดับ</button>

        <div id="history-section" class="history-box hidden">
            <strong>สรุปผลการเล่นรอบล่าสุด:</strong>
            <div id="history-content"></div>
        </div>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="hidden">
        <div class="info-text">คำที่ <span id="current-index">1</span> / 30</div>
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div class="info-text">เวลาเหลือ: <span id="timer-text">10</span> วินาที</div>
        
        <div id="word-display" class="word-display">คำศัพท์</div>
        
        <button class="btn btn-next" onclick="nextWord(true)">NEXT (อ่านได้)</button>
    </div>

    <!-- หน้าสรุปผล -->
    <div id="result-screen" class="hidden">
        <h2>จบเกมแล้ว!</h2>
        <p id="score-summary" class="info-text"></p>
        
        <div id="failed-section">

            <ol id="failed-list" class="failed-list"></ol>
        </div>

        <button class="btn" style="width: auto;" onclick="showStartScreen()">กลับหน้าแรกเพื่อเริ่มเกมใหม่</button>
    </div>
</div>

        levelName = names[level];
    }

    // สุ่มเลือก 30 คำโดยไม่ซ้ำกัน
    const shuffled = [...pool].sort(() => 0.5 - Math.random());
    currentWords = shuffled.slice(0, Math.min(30, shuffled.length));
    
    currentIndex = 0;
    failedWords = [];
    
    // สลับหน้าจอ
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    
    showWord();
}

// แสดงคำศัพท์และเริ่มนับถอยหลัง
function showWord() {
    if (currentIndex >= currentWords.length) {
        endGame();
        return;
    }

    // อัปเดต UI
    document.getElementById('current-index').innerText = currentIndex + 1;
    document.getElementById('word-display').innerText = currentWords[currentIndex];
    
    // รีเซ็ตตัวนับเวลา
    clearInterval(timer);
    timeLeft = 10;
    updateTimerUI();

    // เริ่มจับเวลา (10 วินาที)
    const startTime = Date.now();
    const duration = 10000;

    timer = setInterval(() => {
        const elapsedTime = Date.now() - startTime;
        timeLeft = Math.max(0, (duration - elapsedTime) / 1000);
        updateTimerUI();

        if (timeLeft <= 0) {
            clearInterval(timer);
            // หมดเวลา = อ่านไม่ได้ บันทึกคำศัพท์ไว้
            failedWords.push(currentWords[currentIndex]);
            nextWord(false);
        }
    }, 100);
}

// อัปเดตแถบเวลาและตัวเลข
function updateTimerUI() {
    document.getElementById('timer-text').innerText = Math.ceil(timeLeft);
    const percentage = (timeLeft / 10) * 100;
    document.getElementById('timer-bar').style.width = percentage + '%';
}

// ไปคำถัดไป
function nextWord(isManualNext) {
    clearInterval(timer);
    // ถ้าผู้เล่นกด Next ไม่ทันก่อนหมดเวลา จะถูกนับไปแล้วตอนหมดเวลา
    currentIndex++;
    showWord();
}

// จบเกม
function endGame() {
    clearInterval(timer);
    
    // ซ่อนหน้าเกม แสดงหน้าสรุป
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    const total = currentWords.length;
    const passed = total - failedWords.length;
    
    document.getElementById('score-summary').innerText = `อ่านได้ ${passed} จากทั้งหมด ${total} คำ`;

    // แสดงคำที่อ่านไม่ได้
    const failedListElement = document.getElementById('failed-list');
    failedListElement.innerHTML = '';
    
    if (failedWords.length === 0) {
        document.getElementById('failed-section').innerHTML = "<h3 style='color:green;'>เยี่ยมมาก! คุณอ่านได้ครบทุกคำ</h3>";
    } else {
        document.getElementById('failed-section').innerHTML = `
            <h3>คำศัพท์ที่อ่านไม่ได้/หมดเวลา (${failedWords.length} คำ):</h3>
            <ol id="failed-list" class="failed-list"></ol>
        `;
        const newListEl = document.getElementById('failed-list');
        failedWords.forEach(word => {
            const li = document.createElement('li');
            li.innerText = word;
            newListEl.appendChild(li);
        });
    }

    // บันทึกประวัติรอบล่าสุดไว้แสดงหน้าแรก
    lastGameSummary = `อ่านถูกต้อง ${passed}/${total} คำ | คำที่อ่านไม่ได้: ${failedWords.length > 0 ? failedWords.join(', ') : 'ไม่มี'}`;
}

// กลับหน้าแรก
function showStartScreen() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');

    // แสดงประวัติสรุปรอบก่อน
    if (lastGameSummary) {
        document.getElementById('history-section').classList.remove('hidden');
        document.getElementById('history-content').innerText = lastGameSummary;
    }
}
</script>
